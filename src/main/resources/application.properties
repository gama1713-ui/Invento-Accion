spring.datasource.url=jdbc:h2:mem:invento;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driverClassName=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=${PORT:8080}
# server.port=8081

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

spring.devtools.restart.enabled=true

# MongoDB Atlas
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/invento_accion}
spring.data.mongodb.database=invento_accion

# URL base de la aplicacion
# En local queda vacia y EmailService usa localhost internamente.
# En Render se configura con APP_BASE_URL.
app.base-url=${APP_BASE_URL:}

# Configuracion de correo SMTP
# No colocar credenciales reales en este archivo.
# Las credenciales se deben configurar como variables de entorno.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true